<title>Cleaning Schedule Tracker</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#f3f5f9;color:#1d2433}
header{background:#232f3e;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}header small{color:#ffb84d;font-size:12px}
.wrap{max-width:900px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row label{display:flex;flex-direction:column;font-size:12px;color:#555;flex:1 1 140px;gap:3px}
input,select,button,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid #c9d0db;border-radius:9px;width:100%;min-height:44px}
button{cursor:pointer;background:#fff;width:auto}button.p{background:#ff9900;border-color:#ff9900;color:#111;font-weight:600}
button.wa{background:#25d366;border-color:#25d366;color:#fff;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1 1 160px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.bar{height:14px;background:#e6e9ef;border-radius:7px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:linear-gradient(90deg,#4caf50,#2e7d32);transition:width .3s}
.big{font-size:22px;font-weight:700}.stat{font-size:12px;color:#666}
.grp{font-weight:700;font-size:13px;color:#232f3e;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.item{display:flex;gap:10px;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:6px solid #999}
.item.done{background:#f1faf1}.item.done .area{text-decoration:line-through;color:#6b7a6b}
.ck{position:relative;flex:0 0 34px;height:34px;margin-top:2px}.ck input{position:absolute;opacity:0;width:34px;height:34px;margin:0;cursor:pointer;z-index:2;min-height:0}
.ck span{position:absolute;inset:0;border:2px solid #9aa4b2;border-radius:8px;background:#fff}
.ck input:checked+span{background:#4caf50;border-color:#4caf50}.ck input:checked+span:after{content:'✓';color:#fff;font-size:22px;font-weight:700;position:absolute;left:8px;top:0}
.body{flex:1;min-width:0}.area{font-weight:600;font-size:15px;word-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;align-items:center}
.tag{color:#fff;border-radius:6px;padding:2px 8px;font-size:11px}.pill{background:#eef1f6;border-radius:6px;padding:2px 8px;font-size:11px;color:#333}
.note{margin-top:6px;padding:8px;min-height:38px;font-size:15px}
.x{border:none;background:none;color:#d32f2f;font-size:18px;padding:0 6px;min-height:0;margin-left:auto}
@media(min-width:700px){.wrap{padding:16px}header h1{font-size:20px}}
</style></head><body>

<div class="wrap">
<div class="card row">

</div>
<div class="card row stat"><button onclick="exp()">⬇ Back up data</button><label>Restore <input type="file" accept=".json" onchange="imp(this)"></label>

const K='cleanTracker_v1';

let LS=null;try{LS=window.localStorage;LS.setItem('__t','1');LS.removeItem('__t')}catch(e){LS=null}

function allTasks(){const out=[];BASE.concat(S.custom).forEach(t=>{const parts=t.shift.split(/\s*\+\s*/).map(x=>x.trim()).filter(Boolean);

const SHORT=s=>/ANY/i.test(s)?'A/B/C':s.replace(/\s*or\s*/i,'/');

function due(t,ds){const d=parse(ds);

 const diff=Math.round((d-s)/864e5);
 if(t.freq=='Monthly') return d.getDate()==Math.min(s.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
 if(t.freq=='twice in a week'){const w=diff%7;return w==0||w==3}

function shiftOk(t,f){if(f=='ALL')return true;const s=t.shift.toUpperCase();return s.includes('ANY')||s.split(/\s*(?:\+|OR)\s*/).includes(f)}
function key(ds,id){return ds+'|'+id}
function list(ds){return allTasks().filter(t=>due(t,ds)&&shiftOk(t,$('sh').value)&&($('rs').value=='ALL'||t.resp==$('rs').value)).sort((a,b)=>SO(a.shift)-SO(b.shift))}
function render(){

 <input class="note" value="${(S.notes[k]||'').replace(/"/g,'&quot;')}" placeholder="Add remark…" onchange="note('${t.id}',this.value)"></div></div>`}).join('')||'<div class="card" style="text-align:center">No tasks for this filter</div>';
 $('cl').innerHTML=S.custom.length?'Your added tasks: '+S.custom.map(t=>`${t.area} (${t.freq}, from ${t.start})`).join(' · '):'';
}
function tog(id,v){const k=key($('dt').value,id);if(v){const n=new Date();S.done[k]={by:$('who').value||'',sh:$('sh').value=='ALL'?'':$('sh').value,at:pad(n.getHours())+':'+pad(n.getMinutes())}}else delete S.done[k];save();render()}
function note(id,v){S.notes[key($('dt').value,id)]=v;save()}
function markAll(v){const ds=$('dt').value;list(ds).forEach(t=>{const k=key(ds,t.id);if(!S.done[k]){const n=new Date();S.done[k]={by:$('who').value||'',sh:$('sh').value=='ALL'?'':$('sh').value,at:pad(n.getHours())+':'+pad(n.getMinutes())}}});save();render()}
function addTask(){const a=$('na').value.trim();if(!a)return alert('Enter a task name');
 S.custom.push({id:'c'+Date.now(),area:a,freq:$('nf').value,resp:$('nr').value,shift:$('ns').value,start:$('nd').value||$('dt').value});save();$('na').value='';fillResp();render()}
function delTask(id){if(confirm('Delete this task from all future dates?')){S.custom=S.custom.filter(t=>t.id!=id);save();render()}}
function share(){const ds=$('dt').value,L=list(ds);const dn=L.filter(t=>S.done[key(ds,t.id)]),op=L.filter(t=>!S.done[key(ds,t.id)]);
 const pct=L.length?Math.round(dn.length*100/L.length):0;const bar='█'.repeat(Math.round(pct/10))+'░'.repeat(10-Math.round(pct/10));
 let m=`*🧹 Cleaning Handover – ${parse(ds).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}*\nShift: ${$('sh').value=='ALL'?'All':$('sh').value}${$('who').value?' | By: '+$('who').value:''}\n\n${bar} ${pct}%\n✅ Closed: ${dn.length}/${L.length}\n⏳ Open: ${op.length}\n`;
 if(op.length)m+=`\n*Open – please take over:*\n`+op.map((t,i)=>`${i+1}. ${t.area} [${SHORT(t.shift)}] (${t.freq})${S.notes[key(ds,t.id)]?' – '+S.notes[key(ds,t.id)]:''}`).join('\n');
 const rm=dn.filter(t=>S.notes[key(ds,t.id)]);if(rm.length)m+=`\n\n*Remarks:*\n`+rm.map(t=>`• ${t.area} [${SHORT(t.shift)}]: ${S.notes[key(ds,t.id)]}`).join('\n');
 const u='https://wa.me/?text='+encodeURIComponent(m);const w=window.open(u,'_blank');if(!w){try{navigator.clipboard.writeText(m)}catch(e){}alert('Popup blocked. Summary copied - paste into WhatsApp.')}}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cleaning_tracker_backup_'+iso(new Date())+'.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();fillResp();render();alert('Restored')}catch(e){alert('Invalid file')}};r.readAsText(i.files[0])}
function fillResp(){const v=$('rs').value;const R=[...new Set(allTasks().map(t=>t.resp))];$('rs').innerHTML='<option value="ALL">All</option>'+R.map(r=>`<option>${r}</option>`).join('');$('rs').value=R.includes(v)?v:'ALL'}
$('lg').innerHTML=Object.entries(COL).map(([k,c])=>`<span><i class="dot" style="background:${c}"></i>${k}</span>`).join('');
$('dt').value=iso(new Date());$('nd').value=$('dt').value;$('who').value=S.who||'';
$('who').onchange=()=>{S.who=$('who').value;save()};['dt','sh','rs','st'].forEach(i=>$(i).onchange=render);
fillResp();render();
</script></body></html>
